services:
  api:
    image: hashicorp/http-echo:latest
    command:
      - "-listen=:8080"
      - "-text=Monitoring Service Active"
    networks:
      - monitoring

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
